name: Create release branch
run-name: Create release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without the v prefix (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be SemVer: x.y.z"; exit 1; }
          git ls-remote --exit-code --heads origin "release/v$VERSION" >/dev/null 2>&1 && {
            echo "release/v$VERSION already exists"
            exit 1
          }
          exit 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create version commit and release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          pnpm install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$VERSION"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): v$VERSION"
          git push --set-upstream origin "release/v$VERSION"
